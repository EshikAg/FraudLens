feature_attribution:
  top_k_features: 8
  minimum_feature_contribution: 0.0
  excluded_features:
    - suspicious_neighbour_count
    - label
    - true_label

graph_explanation:
  max_related_transactions: 10
  max_connection_hops: 2
  expose_historical_labels: true
  label_available_at_column: label_available_at
  fraud_labels: [1, "1", true, "true", fraud, suspicious]
  relationship_weights:
    same_sender: 1.0
    same_receiver: 1.0
    same_beneficiary: 1.0
    same_device: 1.3
    same_ip: 1.2
    same_merchant: 0.8
    same_channel: 0.5
    temporal_proximity: 0.5

reason_codes:
  amount_anomaly_multiple: 3.0
  high_velocity_threshold: 5
  multi_account_device_threshold: 3
  high_graph_degree_threshold: 10
  top_reason_codes: 8

risk_thresholds:
  low: 0.2
  medium: 0.5
  high: 0.8

decision_policy:
  low: approve
  medium: review
  high: review
  critical: block

top_feature_reasons: 5
top_related_transactions: 10
